name: Build FizjoGabinet Android APK

on:
  push:
    branches: [android-apk-v1]
    paths:
      - '.github/workflows/build-fizjogabinet-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-49b0-820e-89ff-6c4c9196564c/raw?se=2026-09-15T17%3A02%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=09269544-37fa-5f8c-b9c0-fb4df0d3d5f3&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T08%3A23%3A30Z&ske=2026-09-16T08%3A23%3A30Z&sks=b&skv=2026-02-06&sig=/bY2Rfe5JAHQuunwrrkce7zdVg60Fj1VIU31t2XVu4o%3D'
      SOURCE_SHA256: '9c72a0a6d37e2fe9d21c5bd72cc3b64bf374d45dca1bee09072db310cd445b1c'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download exact FizjoGabinet v7 package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/source
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o android/source/FizjoGabinet_PWA_v7_132_PDF.zip
          echo "$SOURCE_SHA256  android/source/FizjoGabinet_PWA_v7_132_PDF.zip" | sha256sum -c -

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/android/FizjoGabinetAndroid"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/app/src/main/java/pl/fizjogabinet/app"
          mkdir -p "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/drawable" "$ROOT/app/src/main/res/mipmap-anydpi-v26" "$ROOT/app/src/main/res/xml"
          mkdir -p "$ROOT/app/src/main/assets"
          unzip -q "$GITHUB_WORKSPACE/android/source/FizjoGabinet_PWA_v7_132_PDF.zip" -d "$ROOT/app/src/main/assets"

          cat > "$ROOT/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FizjoGabinet"
          include(":app")
          EOF

          cat > "$ROOT/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > "$ROOT/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > "$ROOT/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "pl.fizjogabinet.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "pl.fizjogabinet.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 7
                  versionName = "7.0"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                  }
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.12.1")
              implementation("androidx.core:core:1.15.0")
          }
          EOF

          : > "$ROOT/app/proguard-rules.pro"

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="FizjoGabinet"
                  android:theme="@style/Theme.FizjoGabinet"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true">
                  <activity android:name=".PdfActivity" android:exported="false" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/res/values/colors.xml" <<'EOF'
          <resources>
              <color name="brand">#0F4C5C</color>
              <color name="brand_dark">#0A3945</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/values/themes.xml" <<'EOF'
          <resources>
              <style name="Theme.FizjoGabinet" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:navigationBarColor">@color/brand_dark</item>
                  <item name="android:statusBarColor">@color/brand</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/xml/file_paths.xml" <<'EOF'
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="shared_pdfs" path="pdf/" />
          </paths>
          EOF

          cat > "$ROOT/app/src/main/res/drawable/ic_launcher_foreground.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#0F4C5C" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M27,26h54v10h-44v14h37v10h-37v22h-10z"/>
              <path android:fillColor="#BFE3E8" android:pathData="M72,46a9,9 0,1 0,0.1 0zM68,57h8v25h-8z"/>
          </vector>
          EOF

          cat > "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/brand" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" "$ROOT/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"

          cat > "$ROOT/app/src/main/java/pl/fizjogabinet/app/MainActivity.java" <<'EOF'
          package pl.fizjogabinet.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {
              private WebView webView;
              private WebViewAssetLoader assetLoader;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.WHITE);
                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  assetLoader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri url = request.getUrl();
                          String path = url.getPath();
                          if (path != null && path.toLowerCase().endsWith(".pdf")) {
                              int idx = path.indexOf("/assets/");
                              String assetPath = idx >= 0 ? path.substring(idx + 8) : path.replaceFirst("^/", "");
                              openPdf(assetPath);
                              return true;
                          }
                          if (("http".equals(url.getScheme()) || "https".equals(url.getScheme())) && !"appassets.androidplatform.net".equals(url.getHost())) {
                              startActivity(new Intent(Intent.ACTION_VIEW, url));
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      Uri uri = Uri.parse(url);
                      String path = uri.getPath();
                      if (path != null && path.toLowerCase().endsWith(".pdf")) {
                          int idx = path.indexOf("/assets/");
                          String assetPath = idx >= 0 ? path.substring(idx + 8) : path.replaceFirst("^/", "");
                          openPdf(assetPath);
                      }
                  });
                  webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              private void openPdf(String assetPath) {
                  Intent i = new Intent(this, PdfActivity.class);
                  i.putExtra(PdfActivity.EXTRA_ASSET_PATH, assetPath);
                  startActivity(i);
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          EOF

          cat > "$ROOT/app/src/main/java/pl/fizjogabinet/app/PdfActivity.java" <<'EOF'
          package pl.fizjogabinet.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.pdf.PdfRenderer;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.ParcelFileDescriptor;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;

          public class PdfActivity extends Activity {
              public static final String EXTRA_ASSET_PATH = "asset_path";
              private PdfRenderer renderer;
              private ParcelFileDescriptor descriptor;
              private ImageView imageView;
              private TextView pageLabel;
              private Button prevButton, nextButton;
              private int pageIndex = 0;
              private File cachedFile;

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(15,76,92));
                  String assetPath = getIntent().getStringExtra(EXTRA_ASSET_PATH);
                  if (assetPath == null || !assetPath.toLowerCase().endsWith(".pdf")) { finish(); return; }

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.rgb(245,248,249));

                  LinearLayout toolbar = new LinearLayout(this);
                  toolbar.setOrientation(LinearLayout.HORIZONTAL);
                  toolbar.setGravity(Gravity.CENTER_VERTICAL);
                  toolbar.setPadding(12,10,12,10);
                  toolbar.setBackgroundColor(Color.rgb(15,76,92));
                  Button back = new Button(this); back.setText("← Wróć"); back.setOnClickListener(v -> finish()); toolbar.addView(back);
                  TextView title = new TextView(this); title.setText("  PDF ćwiczeń"); title.setTextColor(Color.WHITE); title.setTextSize(18); title.setMaxLines(1);
                  toolbar.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  Button share = new Button(this); share.setText("Udostępnij"); share.setOnClickListener(v -> sharePdf()); toolbar.addView(share);
                  root.addView(toolbar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));

                  imageView = new ImageView(this); imageView.setAdjustViewBounds(true); imageView.setScaleType(ImageView.ScaleType.FIT_CENTER); imageView.setBackgroundColor(Color.WHITE);
                  root.addView(imageView, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  LinearLayout nav = new LinearLayout(this); nav.setGravity(Gravity.CENTER); nav.setPadding(8,8,8,8);
                  prevButton = new Button(this); prevButton.setText("Poprzednia"); prevButton.setOnClickListener(v -> showPage(pageIndex - 1)); nav.addView(prevButton);
                  pageLabel = new TextView(this); pageLabel.setPadding(20,0,20,0); pageLabel.setTextSize(16); nav.addView(pageLabel);
                  nextButton = new Button(this); nextButton.setText("Następna"); nextButton.setOnClickListener(v -> showPage(pageIndex + 1)); nav.addView(nextButton);
                  root.addView(nav);
                  setContentView(root);

                  try {
                      cachedFile = copyAssetToCache(assetPath);
                      descriptor = ParcelFileDescriptor.open(cachedFile, ParcelFileDescriptor.MODE_READ_ONLY);
                      renderer = new PdfRenderer(descriptor);
                      showPage(0);
                  } catch (Exception e) {
                      title.setText("  Nie udało się otworzyć PDF");
                      imageView.setVisibility(View.GONE); nav.setVisibility(View.GONE);
                  }
              }

              private File copyAssetToCache(String assetPath) throws Exception {
                  File dir = new File(getCacheDir(), "pdf");
                  if (!dir.exists() && !dir.mkdirs()) throw new IllegalStateException("Brak katalogu cache");
                  File out = new File(dir, assetPath.replace('/', '_').replace('\\', '_'));
                  try (InputStream in = getAssets().open(assetPath); FileOutputStream fos = new FileOutputStream(out)) {
                      byte[] buf = new byte[16384]; int n; while ((n=in.read(buf))!=-1) fos.write(buf,0,n);
                  }
                  return out;
              }

              private void showPage(int index) {
                  if (renderer == null || index < 0 || index >= renderer.getPageCount()) return;
                  pageIndex = index;
                  try (PdfRenderer.Page page = renderer.openPage(index)) {
                      int maxWidth = Math.max(getResources().getDisplayMetrics().widthPixels * 2, 1200);
                      float scale = (float)maxWidth / page.getWidth();
                      Bitmap bitmap = Bitmap.createBitmap(Math.max(1,Math.round(page.getWidth()*scale)), Math.max(1,Math.round(page.getHeight()*scale)), Bitmap.Config.ARGB_8888);
                      bitmap.eraseColor(Color.WHITE);
                      page.render(bitmap, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                      imageView.setImageBitmap(bitmap);
                  }
                  pageLabel.setText((pageIndex+1) + " / " + renderer.getPageCount());
                  prevButton.setEnabled(pageIndex > 0); nextButton.setEnabled(pageIndex < renderer.getPageCount()-1);
              }

              private void sharePdf() {
                  if (cachedFile == null || !cachedFile.exists()) return;
                  Uri uri = FileProvider.getUriForFile(this, getPackageName()+".files", cachedFile);
                  Intent share = new Intent(Intent.ACTION_SEND); share.setType("application/pdf"); share.putExtra(Intent.EXTRA_STREAM, uri); share.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(Intent.createChooser(share, "Udostępnij PDF"));
              }

              @Override protected void onDestroy() {
                  if (renderer != null) renderer.close();
                  if (descriptor != null) try { descriptor.close(); } catch (Exception ignored) {}
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd android/FizjoGabinetAndroid
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/FizjoGabinet-v7-Android.apk"
          test -s "$GITHUB_WORKSPACE/FizjoGabinet-v7-Android.apk"
          ls -lh "$GITHUB_WORKSPACE/FizjoGabinet-v7-Android.apk"

      - name: Upload ready APK
        uses: actions/upload-artifact@v4
        with:
          name: FizjoGabinet-v7-Android-APK
          path: FizjoGabinet-v7-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save Android project and source package in repository
        continue-on-error: true
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/source/FizjoGabinet_PWA_v7_132_PDF.zip android/FizjoGabinetAndroid
          if ! git diff --cached --quiet; then
            git commit -m "Add generated FizjoGabinet Android project and v7 source"
            git push origin HEAD:android-apk-v1
          fi
