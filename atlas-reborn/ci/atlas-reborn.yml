name: Atlas Reborn QA
on:
  push:
    branches: ['codex/atlas-echa-ruchu']
    paths: ['atlas-reborn/**', '.github/workflows/atlas-reborn.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: atlas-reborn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8766 > /tmp/atlas-server.log 2>&1 &
      - run: node tests/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-browser-qa
          path: atlas-reborn/tests/screenshots/
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.1" "platforms;android-35"'
      - run: gradle -p atlas-reborn/android assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash atlas-reborn/tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-android-qa
          path: atlas-reborn/tests/android-results/
