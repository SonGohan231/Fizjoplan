plugins { id 'com.android.application' }
android {
 namespace 'pl.somaskan.atlasecharuchu'
 compileSdk 35
 buildToolsVersion '35.0.1'
 defaultConfig { applicationId 'pl.somaskan.atlasecharuchu'; minSdk 26; targetSdk 35; versionCode 10000; versionName '1.0.0' }
 buildFeatures { buildConfig true }
 buildTypes { release { debuggable false; minifyEnabled false } }
}
def webRoot = rootProject.projectDir.parentFile
tasks.register('syncWebAssets', Sync) {
 from(webRoot) { include 'index.html','style.css','src/**','assets/**','vendor/**' }
 into layout.projectDirectory.dir('src/main/assets')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
